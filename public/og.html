<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>Video Slicer — share banner</title>
  <!--
    Source for og.jpg / og.png (1200×630). Rendered headless, not served to users.
    Built from the app's own tokens and the home hero: headline, the three
    stills on their diagonal, the URL. Everything that matters sits inside the
    central 1080×560 so X (2:1), LinkedIn (1.91:1) and iMessage crops keep it.
    ?theme=light renders the light variant.
  -->
  <style>
    @font-face { font-family: 'Macklin Text'; src: url('https://framerusercontent.com/assets/wSxjAeY6OZtXw1rD6WXv537x6c.woff2') format('woff2'); font-weight: 100 399; }
    @font-face { font-family: 'Macklin Text'; src: url('https://framerusercontent.com/assets/NX2yz2Uv7UiNIFzULtbVuKao.woff2') format('woff2'); font-weight: 400 900; }
    @font-face { font-family: 'Macklin Sans'; src: url('https://framerusercontent.com/assets/R8hgLQrdfV7W2NyqNRHcjtcQ.woff2') format('woff2'); font-weight: 100 399; }
    @font-face { font-family: 'Macklin Sans'; src: url('https://framerusercontent.com/assets/Dx605dspPEoD6HBybzWhaTZusE.woff2') format('woff2'); font-weight: 400 499; }
    @font-face { font-family: 'Macklin Sans'; src: url('/fonts/MacklinSans-Medium.woff2') format('woff2'); font-weight: 500 900; }
    @font-face { font-family: 'Fragment Mono'; src: url('/fonts/FragmentMono-Regular.woff2') format('woff2'); }

    /* App tokens (src/styles/tokens.css) */
    :root {
      --c-bg: rgb(28 25 23); --c-surface: rgb(36 34 32); --c-surface-raised: rgb(46 43 40);
      --c-brand: rgb(158 129 112); --c-on-brand: rgb(28 25 23);
      --c-text-primary: rgb(245 241 237 / 0.85); --c-text-secondary: rgb(184 176 168 / 0.67); --c-text-subtle: rgb(184 176 168 / 0.80);
      --c-border: rgb(255 255 255 / 0.10); --c-media: rgb(12 10 9);
      --shadow-float: 0 2px 6px rgb(0 0 0 / 0.30), 0 24px 56px rgb(0 0 0 / 0.45);
      --glow: radial-gradient(60% 70% at 78% 55%, rgb(158 129 112 / 0.16), transparent 70%);
    }
    :root[data-theme="light"] {
      --c-bg: rgb(247 240 235); --c-surface: rgb(245 242 237); --c-surface-raised: rgb(255 255 255);
      --c-brand: rgb(70 67 62); --c-on-brand: rgb(245 242 237);
      --c-text-primary: rgb(0 0 0 / 0.85); --c-text-secondary: rgb(0 0 0 / 0.67); --c-text-subtle: rgb(0 0 0 / 0.60);
      --c-border: rgb(0 0 0 / 0.10);
      --shadow-float: 0 2px 6px rgb(70 67 62 / 0.10), 0 24px 56px rgb(70 67 62 / 0.18);
      --glow: radial-gradient(60% 70% at 78% 55%, rgb(255 255 255 / 0.7), transparent 70%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { background: var(--c-bg); color: var(--c-text-primary); font-family: 'Macklin Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    .banner { position: relative; width: 1200px; height: 630px; background: var(--glow), var(--c-bg); overflow: hidden; }

    .copy { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 640px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 12px; font: 400 22px/1 'Macklin Text', Georgia, serif; }
    .brand img { width: 36px; height: 36px; }
    .brand__by { margin-left: 4px; font: 300 20px/1 'Macklin Sans', system-ui, sans-serif; color: var(--c-text-subtle); }
    h1 { margin-top: auto; font: 400 80px/80px 'Macklin Text', Georgia, serif; letter-spacing: -0.025em; }
    .lede { margin-top: 24px; font: 300 26px/36px 'Macklin Sans', system-ui, sans-serif; color: var(--c-text-secondary); max-width: 500px; }
    .foot { margin-top: auto; display: flex; align-items: center; gap: 16px; }
    .url { font: 500 20px/1 'Macklin Sans', system-ui, sans-serif; color: var(--c-text-primary); }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--c-border); border-radius: 999px; font: 500 16px/1 'Macklin Sans', system-ui, sans-serif; color: var(--c-text-subtle); }
    .pill svg { width: 16px; height: 16px; }

    /* The hero pile, descending left → right like the home */
    .stills { position: absolute; left: 676px; top: 92px; width: 470px; height: 450px; }
    .still { position: absolute; width: 290px; padding: 8px; border: 1px solid var(--c-border); border-radius: 16px; background: var(--c-surface-raised); box-shadow: var(--shadow-float); }
    .still__media { display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: var(--c-media); }
    .still__media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .still figcaption { display: flex; justify-content: space-between; padding: 10px 4px 2px; font: 400 15px/1 'Fragment Mono', ui-monospace, monospace; color: var(--c-text-subtle); }
    .s1 { left: 0;     top: 0;     rotate: -3deg; }
    .s2 { left: 90px;  top: 112px; rotate: 2deg; }
    .s3 { left: 180px; top: 224px; rotate: -1deg; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="copy">
      <div class="brand"><img src="/logo.svg" alt="" /> Video Slicer <span class="brand__by">by Jorge Verlindo</span></div>
      <h1>Drop a video.<br />Keep every frame.</h1>
      <p class="lede">Stills, a transcript or a storyboard from any clip, right in your browser.</p>
      <div class="foot">
        <span class="url">videoslicer.jorgeverlindo.design</span>
      </div>
    </div>

    <div class="stills" aria-hidden="true">
      <figure class="still s1"><span class="still__media"><img data-n="01" alt="" /></span><figcaption><span>#004</span><span>00:00:04.0</span></figcaption></figure>
      <figure class="still s2"><span class="still__media"><img data-n="02" alt="" /></span><figcaption><span>#009</span><span>00:00:09.0</span></figcaption></figure>
      <figure class="still s3"><span class="still__media"><img data-n="03" alt="" /></span><figcaption><span>#013</span><span>00:00:13.0</span></figcaption></figure>
    </div>
  </div>
  <script>
    const theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark'
    document.documentElement.dataset.theme = theme
    document.querySelectorAll('img[data-n]').forEach((img) => { img.src = `/hero/trajectory-${img.dataset.n}-${theme}.webp` })
  </script>
</body>
</html>
