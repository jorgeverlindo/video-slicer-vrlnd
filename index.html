<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Slicer · Jorge Verlindo</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Theme before first paint, so dark mode never flashes the light
         background. Must agree with useTheme() in ThemeToggle.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('framestack-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('framestack-theme', t);
      } catch (e) {}
    </script>

    <!-- The two faces the home renders, fetched alongside the JS instead of
         after it. URLs must match the @font-face rules in index.css. -->
    <link rel="preconnect" href="https://framerusercontent.com" crossorigin />
    <link rel="preload" href="https://framerusercontent.com/assets/NX2yz2Uv7UiNIFzULtbVuKao.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://framerusercontent.com/assets/Dx605dspPEoD6HBybzWhaTZusE.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph -->
    <meta property="og:title"       content="Video Slicer · Jorge Verlindo" />
    <meta property="og:description" content="Extract frames from any video, locally in your browser. No upload, no server — the file never leaves your machine." />
    <meta property="og:image"       content="https://videoslicer.jorgeverlindo.design/og.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"         content="https://videoslicer.jorgeverlindo.design" />
    <meta property="og:type"        content="website" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Video Slicer · Jorge Verlindo" />
    <meta name="twitter:description" content="Extract frames from any video, locally in your browser. No upload, no server — the file never leaves your machine." />
    <meta name="twitter:image"       content="https://videoslicer.jorgeverlindo.design/og.jpg" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N9T3ZBH55Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N9T3ZBH55Q');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
